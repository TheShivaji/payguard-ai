services:
  postgres:
    image: postgres:17-alpine

    container_name: payguard-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payguard

    ports:
      - "5432:5432"

    volumes:
      - payguard_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d payguard" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

volumes:
  payguard_pgdata:
